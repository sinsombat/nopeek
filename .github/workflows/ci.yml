name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build (macOS 26, arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version | head -2

      - name: Test suite (make test)
        run: make test

      - name: App bundle smoke build (make app)
        run: make app
